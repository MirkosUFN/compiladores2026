<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Removedor de Comentários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F1;
    --panel: #FFFFFF;
    --ink: #1C1B18;
    --ink-soft: #6E6C63;
    --line: #E3E1D8;
    --accent: #3E5C4E;
    --accent-soft: #E4EAE4;
    --removed: #B0473C;
  }
 
  * { box-sizing: border-box; }
 
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
  }
 
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 2rem;
  }
 
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.75rem;
  }
 
  h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    margin: 0 0 0.6rem;
    letter-spacing: -0.01em;
  }
 
  h1 span { color: var(--accent); }
 
  .sub {
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 560px;
    line-height: 1.55;
    margin: 0;
  }
 
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 2rem;
  }
 
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
  }
 
  .stats {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    display: flex;
    gap: 18px;
  }
 
  .stats b { color: var(--ink); font-weight: 500; }
 
  .actions { display: flex; gap: 8px; }
 
  button {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
 
  button:hover { border-color: var(--accent); background: var(--accent-soft); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
 
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
 
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
  }
 
  .pane {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
 
  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
 
  .pane-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
 
  .pane-label.out { color: var(--accent); }
 
  textarea, pre {
    margin: 0;
    border: 0;
    resize: none;
    width: 100%;
    height: 520px;
    padding: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    background: transparent;
    overflow: auto;
    white-space: pre;
  }
 
  textarea { outline: none; }
  textarea::placeholder { color: #B8B6AC; }
 
  pre { color: var(--ink); }
 
  footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
 
<header>
 
  <h1>Removedor de Comentários</h1>
</header>
 
<main>
  <div class="toolbar">
    <div class="stats">
      <span>linhas: <b id="statLines">0</b></span>
      <span>comentários removidos: <b id="statComments">0</b></span>
      <span>caracteres removidos: <b id="statChars">0</b></span>
    </div>
    <div class="actions">
      <button id="btnPaste">colar</button>
      <button id="btnCopy">copiar resultado</button>
      <button id="btnClear">limpar</button>
    </div>
  </div>
 
  <div class="grid">
    <div class="pane">
      <div class="pane-head">
        <span class="pane-label">entrada</span>
      </div>
      <textarea id="input" placeholder="cole aqui seu código com comentários..." spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">
        <span class="pane-label out">saída — sem comentários</span>
      </div>
      <pre id="output"></pre>
    </div>
  </div>
</main>
 
<script>
  function stripComments(src) {
    const STATE = { NORMAL: 0, STRING: 1, CHAR: 2, LINE: 3, BLOCK: 4 };
    let state = STATE.NORMAL;
    let out = '';
    let commentsRemoved = 0;
    let charsRemoved = 0;
    let i = 0;
    const n = src.length;
 
    while (i < n) {
      const c = src[i];
 
      if (state === STATE.NORMAL) {
        if (c === '/' && src[i + 1] === '/') {
          out += '  ';
          charsRemoved += 2;
          commentsRemoved++;
          state = STATE.LINE;
          i += 2;
          continue;
        }
        if (c === '/' && src[i + 1] === '*') {
          out += '  ';
          charsRemoved += 2;
          commentsRemoved++;
          state = STATE.BLOCK;
          i += 2;
          continue;
        }
        if (c === '"') { out += c; state = STATE.STRING; i++; continue; }
        if (c === "'") { out += c; state = STATE.CHAR; i++; continue; }
        out += c;
        i++;
        continue;
      }
 
      if (state === STATE.STRING) {
        out += c;
        if (c === '\\') { out += src[i + 1] ?? ''; i += 2; continue; }
        if (c === '"') { state = STATE.NORMAL; }
        i++;
        continue;
      }
 
      if (state === STATE.CHAR) {
        out += c;
        if (c === '\\') { out += src[i + 1] ?? ''; i += 2; continue; }
        if (c === "'") { state = STATE.NORMAL; }
        i++;
        continue;
      }
 
      if (state === STATE.LINE) {
        if (c === '\n') { out += '\n'; state = STATE.NORMAL; }
        else { out += ' '; charsRemoved++; }
        i++;
        continue;
      }
 
      if (state === STATE.BLOCK) {
        if (c === '\n') { out += '\n'; i++; continue; }
        if (c === '*' && src[i + 1] === '/') {
          out += '  ';
          charsRemoved += 2;
          state = STATE.NORMAL;
          i += 2;
          continue;
        }
        out += ' ';
        charsRemoved++;
        i++;
        continue;
      }
    }
 
    return { result: out, commentsRemoved, charsRemoved };
  }
 
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const statLines = document.getElementById('statLines');
  const statComments = document.getElementById('statComments');
  const statChars = document.getElementById('statChars');
 
  function update() {
    const src = input.value;
    const { result, commentsRemoved, charsRemoved } = stripComments(src);
    output.textContent = result;
    statLines.textContent = src ? src.split('\n').length : 0;
    statComments.textContent = commentsRemoved;
    statChars.textContent = charsRemoved;
  }
 
  input.addEventListener('input', update);
 
  document.getElementById('btnClear').addEventListener('click', () => {
    input.value = '';
    update();
    input.focus();
  });
 
  document.getElementById('btnCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.textContent);
      const btn = document.getElementById('btnCopy');
      const original = btn.textContent;
      btn.textContent = 'copiado!';
      setTimeout(() => { btn.textContent = original; }, 1200);
    } catch (e) {
      /* clipboard indisponível — ignora silenciosamente */
    }
  });
 
  document.getElementById('btnPaste').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      input.value = text;
      update();
    } catch (e) {
      input.focus();
    }
  });
 
  update();
</script>
</body>
</html>
